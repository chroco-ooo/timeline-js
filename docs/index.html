<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>GoJS 年代別年表</title>
    <script src="https://unpkg.com/gojs@2.2.16/release/go.js"></script>
    <script>
        function init() {
            const $ = go.GraphObject.make;

            const myDiagram = $(go.Diagram, "myDiagramDiv", {
                "undoManager.isEnabled": true,
                layout: $(go.GridLayout, {
                    wrappingColumn: 0,
                    alignment: go.GridLayout.Position,
                    cellSize: new go.Size(1, 1),
                    spacing: new go.Size(20, 20)
                })
            });

            // グループテンプレート（年代枠）
            myDiagram.groupTemplate =
                $(go.Group, "Vertical",
                    {
                        layout: $(go.GridLayout, {
                            wrappingColumn: 1,
                            alignment: go.GridLayout.Position
                        }),
                        background: "lightgray",
                        padding: 10
                    },
                    $(go.TextBlock,
                        { font: "Bold 12pt Sans-Serif", margin: 5 },
                        new go.Binding("text", "key")),
                    $(go.Panel, "Auto",
                        $(go.Shape, "Rectangle",
                            { fill: null, stroke: "black", strokeWidth: 2 }),
                        $(go.Placeholder, { padding: 10 })
                    )
                );

            // ノードテンプレート（プロジェクト）
            myDiagram.nodeTemplate =
                $(go.Node, "Auto",
                    $(go.Shape, "RoundedRectangle",
                        { fill: "white", stroke: "black" }),
                    $(go.TextBlock,
                        { margin: 5 },
                        new go.Binding("text", "name"))
                );

            // モデルデータの設定
            myDiagram.model = new go.GraphLinksModel(
                [
                    { key: "2011", isGroup: true },
                    { key: "2012", isGroup: true },
                    { key: "2013", isGroup: true },
                    { key: 1, name: "プロジェクトA", group: "2011" },
                    { key: 2, name: "プロジェクトB", group: "2012" },
                    { key: 3, name: "プロジェクトC", group: "2013" }
                ]
            );
        }
    </script>
</head>

<body onload="init()">
    <div id="myDiagramDiv" style="width:100%; height:600px; border:1px solid black"></div>
</body>

</html>
