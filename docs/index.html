<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Timeline Generator</title>
    <link rel="stylesheet" href="./css/timeline.css">
</head>

<body>

    <div id="timeline-container">
        <div class="timeline-section timeline-years" id="timeline-years"></div>
        <div class="timeline-section timeline-months" id="timeline-months"></div>
        <div class="timeline-section timeline-grid" id="timeline-grid"></div>
    </div>

    <script src="timeline.js"></script>
    <script>
        const timeline = new TimelineGenerator({
            targetId: "timeline-container",
            startDate: "2011-01",
            endDate: "2013-12",
            scale: "month",
            projects: [
                { id: "p1", name: "プロジェクトA", start: "2011-02", end: "2011-03", lane: 1, color: "#4fc3f7" },
                { id: "p2", name: "プロジェクトB", start: "2012-04", end: "2012-05", lane: 2, color: "#81c784" },
                { id: "p3", name: "プロジェクトC", start: "2012-08", end: "2012-09", lane: 1, color: "#ffb74d" },
                { id: "p4", name: "プロジェクトD", start: "2013-05", end: "2013-04", lane: 3, color: "#ba68c8" },
                { id: "p5", name: "プロジェクトE", start: "2011-01", end: "2011-02", lane: 2, color: "#ba68c8" }
            ],
            links: [
                { from: "p1", to: "p2" },
                { from: "p2", to: "p3" },
                { from: "p3", to: "p4" },
                { from: "p1", to: "p3" },
                { from: "p5", to: "p1" },
                 // 複数分岐も可能
            ]
        });
        timeline.render();
    </script>

</body>

</html>
