<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Timeline Generator Sample</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        #timeline-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: #ffffff;
            border: 1px solid #ccc;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .timeline-grid {
            display: grid;
            position: relative;
            width: max-content;
            height: 100%;
            grid-auto-rows: 120px;
        }

        .timeline-year {
            text-align: center;
            font-weight: bold;
            background: #eee;
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timeline-cell {
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }
    </style>
</head>

<body>

    <div id="timeline-container"></div>

    <script>
        class TimelineGenerator {
            constructor(options) {
                this.targetId = options.targetId;
                this.startDate = options.startDate;
                this.endDate = options.endDate;
                this.scale = options.scale || 'month'; // 'month' or 'year'
                this.projects = options.projects || [];
                this.links = options.links || [];
            }

            render() {
                const container = document.getElementById(this.targetId);
                if (!container) {
                    console.error("ターゲット要素が見つかりません");
                    return;
                }

                container.innerHTML = ''; // 初期化

                // グリッドベース作成
                const grid = document.createElement('div');
                grid.className = 'timeline-grid';

                const months = this.generateMonths();
                grid.style.gridTemplateColumns = `repeat(${months.length}, 120px)`;

                // 年表ヘッダー
                months.forEach((month, index) => {
                    const isYearStart = month.endsWith('-01');
                    const cell = document.createElement('div');
                    cell.className = isYearStart ? 'timeline-year' : 'timeline-cell';
                    cell.innerText = isYearStart ? month.substring(0, 4) : '';
                    grid.appendChild(cell);
                });

                container.appendChild(grid);
            }

            generateMonths() {
                const result = [];
                let current = this.parseDate(this.startDate);
                const end = this.parseDate(this.endDate);

                while (current <= end) {
                    result.push(this.formatDate(current));
                    if (this.scale === 'month') {
                        current.setMonth(current.getMonth() + 1);
                    } else if (this.scale === 'year') {
                        current.setFullYear(current.getFullYear() + 1);
                    }
                }
                return result;
            }

            parseDate(str) {
                const [year, month] = str.split('-').map(Number);
                return new Date(year, (month || 1) - 1);
            }

            formatDate(date) {
                const y = date.getFullYear();
                const m = (date.getMonth() + 1).toString().padStart(2, '0');
                return `${y}-${m}`;
            }
        }

        // テスト実行
        const timeline = new TimelineGenerator({
            targetId: "timeline-container",
            startDate: "2011-01",
            endDate: "2015-12",
            scale: "month",
            projects: [],
            links: []
        });
        timeline.render();
    </script>

</body>

</html>
